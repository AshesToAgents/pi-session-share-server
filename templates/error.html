<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - Session</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 24px auto;
            border-radius: 2px;
        }
        p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
        }
        .home-link {
            display: inline-block;
            margin-top: 24px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <h1>{{title}}</h1>
        <div class="divider"></div>
        <p>{{message}}</p>
        <a href="/" class="home-link">← Back to home</a>
    </div>
</body>
</html>
