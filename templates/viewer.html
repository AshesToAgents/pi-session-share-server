<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Session</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-text {
            color: #6b7280;
            font-size: 15px;
        }
        .key-missing {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .key-icon {
            font-size: 64px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 24px auto;
            border-radius: 2px;
        }
        p {
            margin: 0;
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
        }
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 16px 24px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
        }
        body.content-visible {
            background: white;
            padding: 0;
        }
        body.content-visible .container {
            max-width: none;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            min-height: 100vh;
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }
        iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: white;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p class="status-text">Decrypting session...</p>
        </div>

        <div id="key-missing" class="key-missing hidden">
            <div class="key-icon">🔑</div>
            <h1>Missing Decryption Key</h1>
            <div class="divider"></div>
            <p>This session is encrypted. You need the full link including the key in the URL fragment.</p>
            <p style="font-size: 14px; margin-top: 8px;">The key should look like: <code>#k=base64string...</code></p>
        </div>

        <div id="error" class="hidden">
            <div class="key-icon">⚠️</div>
            <h1>Decryption Failed</h1>
            <div class="divider"></div>
            <div id="error-message" class="error-box"></div>
        </div>

        <div id="content" class="iframe-container hidden">
            <iframe id="session-frame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <script>
        const IV_LENGTH = 12;

        function show(id) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('key-missing').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('content').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            show('error');
        }

        function base64urlToBase64(b64url) {
            let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4 !== 0) b64 += '=';
            return b64;
        }

        function base64ToBytes(base64) {
            const binString = atob(base64);
            const bytes = new Uint8Array(binString.length);
            for (let i = 0; i < binString.length; i++) {
                bytes[i] = binString.charCodeAt(i);
            }
            return bytes;
        }

        function bytesToString(bytes) {
            return new TextDecoder().decode(bytes);
        }

        async function decrypt(ciphertext, key) {
            const keyBytes = base64ToBytes(base64urlToBase64(key));
            
            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                keyBytes,
                { name: 'AES-GCM' },
                false,
                ['decrypt']
            );

            const ciphertextBytes = base64ToBytes(ciphertext);
            
            const iv = ciphertextBytes.slice(0, IV_LENGTH);
            const encryptedData = ciphertextBytes.slice(IV_LENGTH);
            
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                cryptoKey,
                encryptedData
            );

            return bytesToString(decrypted);
        }

        async function main() {
            const hash = location.hash;
            if (!hash || !hash.startsWith('#k=')) {
                show('key-missing');
                return;
            }

            const key = hash.slice(3);
            const ciphertext = "{{ciphertext}}";

            try {
                const html = await decrypt(ciphertext, key);
                
                const iframe = document.getElementById('session-frame');
                iframe.srcdoc = html;
                document.body.classList.add('content-visible');
                // The iframe is sized to the viewport and the exported session
                // document scrolls internally. This keeps the export's sticky
                // sidebar working and its layout adapting to content changes
                // (collapsed thinking blocks, expanded tool output, ...).
                show('content');
            } catch (err) {
                showError('Failed to decrypt: ' + (err.message || 'Invalid key or corrupted data'));
            }
        }

        main();
    </script>
</body>
</html>
