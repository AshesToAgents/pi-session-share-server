services:
  server:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - DB_PATH=/data/sessions.db
      - CLEANUP_INTERVAL=${CLEANUP_INTERVAL:-5m}
      - COOKIE_SECRET=${COOKIE_SECRET:-}
    volumes:
      - db:/data
    restart: unless-stopped

volumes:
  db:
